<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="50%" style="stop-color:#fff7ed"/>
      <stop offset="100%" style="stop-color:#fff1f2"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid cells (meal planner visual) -->
  <g opacity="0.12">
    <rect x="600" y="80" width="520" height="460" rx="24" fill="#f59e0b"/>
    <rect x="620" y="100" width="140" height="90" rx="12" fill="#f59e0b"/>
    <rect x="780" y="100" width="140" height="90" rx="12" fill="#f97316"/>
    <rect x="940" y="100" width="140" height="90" rx="12" fill="#fb923c"/>
    <rect x="620" y="210" width="140" height="90" rx="12" fill="#fb923c"/>
    <rect x="780" y="210" width="140" height="90" rx="12" fill="#f59e0b"/>
    <rect x="940" y="210" width="140" height="90" rx="12" fill="#f97316"/>
    <rect x="620" y="320" width="140" height="90" rx="12" fill="#f97316"/>
    <rect x="780" y="320" width="140" height="90" rx="12" fill="#fb923c"/>
    <rect x="940" y="320" width="140" height="90" rx="12" fill="#f59e0b"/>
    <rect x="620" y="430" width="460" height="90" rx="12" fill="#fbbf24"/>
  </g>

  <!-- Icon background -->
  <rect x="80" y="175" width="88" height="88" rx="24" fill="url(#icon)"/>

  <!-- Utensils icon (simplified SVG path) -->
  <g transform="translate(104, 199)" fill="white" opacity="0.95">
    <rect x="8" y="0" width="4" height="24" rx="2"/>
    <rect x="16" y="0" width="4" height="24" rx="2"/>
    <rect x="24" y="0" width="4" height="24" rx="2"/>
    <rect x="6" y="8" width="20" height="4" rx="2"/>
    <rect x="36" y="0" width="4" height="10" rx="2"/>
    <path d="M36 14 Q50 14 50 20 L50 24 Q38 24 36 18 Z" />
  </g>

  <!-- Main heading -->
  <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#1c1917" letter-spacing="-2">Weekly Meal</text>
  <text x="80" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#1c1917" letter-spacing="-2">Planner</text>

  <!-- Tagline -->
  <text x="80" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="#78716c">Plan family meals for the week — free</text>

  <!-- Feature pills -->
  <rect x="80" y="516" width="176" height="42" rx="21" fill="#fef3c7"/>
  <text x="168" y="543" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#92400e">7-day grid</text>

  <rect x="272" y="516" width="196" height="42" rx="21" fill="#ffedd5"/>
  <text x="370" y="543" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Save favorites</text>

  <rect x="484" y="516" width="226" height="42" rx="21" fill="#fef9c3"/>
  <text x="597" y="543" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#713f12">Recipe suggestions</text>

  <!-- Domain -->
  <text x="1120" y="600" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#a8a29e">weeklymealplan.space</text>
</svg>
